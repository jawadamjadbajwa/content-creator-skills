<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Sponsored by Syno Clips</title>
  <desc id="d">Syno Clips turns live streams and videos into viral clips, with captions, framing and scores by AI, and publishes to four platforms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B4D"/>
      <stop offset="0.55" stop-color="#1A3FB8"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#glow)"/>

  <!-- clip icon: a vertical phone frame with a play triangle -->
  <g transform="translate(64 58)">
    <rect x="0" y="0" width="84" height="144" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"/>
    <rect x="12" y="14" width="60" height="98" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <path d="M34 46 L56 63 L34 80 Z" fill="#FFFFFF"/>
    <rect x="32" y="124" width="20" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#FFFFFF">
    <text x="182" y="76" font-size="20" font-weight="600" letter-spacing="3" fill-opacity="0.75">SPONSORED BY</text>
    <text x="180" y="132" font-size="54" font-weight="800">Syno Clips</text>
    <text x="182" y="174" font-size="22" fill-opacity="0.92">Turn live streams and videos into viral clips</text>
    <text x="182" y="206" font-size="18" fill-opacity="0.75">Captions, framing and scores by AI  •  Publish to four platforms</text>
  </g>

  <!-- call to action -->
  <g transform="translate(908 98)">
    <rect width="236" height="64" rx="32" fill="url(#btn)"/>
    <text x="118" y="41" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A3FB8">Try Syno Clips →</text>
  </g>
  <text x="1026" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#FFFFFF" fill-opacity="0.8">clips.synofex.com</text>
</svg>
